theme = "noctalia"

[editor]
bufferline = "multiple"
clipboard-provider = "wayland"

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = [ "mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator" ]
right = [ "diagnostics", "selections", "register", "file-encoding", "version-control" ]

[editor.cursor-shape]
insert = "bar"

[editor.soft-wrap]
enable = true
